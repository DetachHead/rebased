review.help=Open a multi-file diff review session for a git changeset
review.application.usage=Usage: rebased review [<ref>]\n\nOpens a diff review session for every file changed relative to <ref> (or\nuncommitted changes, if <ref> is omitted). <ref> may be a single ref (compared\nagainst the working tree) or two refs/a range (compared against each other),\ne.g. "HEAD~1", "main", or "main..feature".
review.application.nothing.to.review=Nothing to review
action.Git.Review.FinishReview.text=Finish Review
action.Git.Review.FinishReview.description=Export all comments left in this review session to a JSON file and close the review
action.Git.Review.FinishGlobalReview.text=Finish Review
action.Git.Review.FinishGlobalReview.description=Export all review comments left on local changes to a JSON file
finish.review.export.failed=Failed to export review comments: {0}
finish.review.window.not.found=Could not find the review window to close; the exported comments are saved, but the review process may not exit
review.comment.dialog.title=Add Review Comment
review.comment.dialog.message=Enter your comment for this line:
